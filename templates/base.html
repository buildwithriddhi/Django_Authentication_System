<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>{% block title %}{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary mb-4">
            <!-- Replaced container-fluid with a single container and added justify class -->
            <div class="container d-flex justify-content-between align-items-center">
                <a class="navbar-brand" href="{% url 'home' %}">Home</a>
                
                <!-- This wrapper cleanly presents the buttons grouped together on the far right -->
                <div class="d-flex gap-2">
                    {% if user.is_authenticated %}
                        <div class="containet mt-2">
                            <a href="{% url 'secret_page' %}" class="link-secondary text-decoration-none fw-medium">Secret Page</a>
                            <a href="{% url 'password_change' %}" class="link-secondary text-decoration-none fw-medium">Change Password</a>
                        </div>
                        <form action="{% url 'logout' %}" method="post" class="m-0">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-outline-danger">Log Out</button>
                        </form>
                    {% else %}
                        <a href="{% url 'login' %}" class="btn btn-outline-secondary">Log In</a>
                        <a href="{% url 'signup' %}" class="btn btn-primary">Sign Up</a>
                    {% endif %}
                </div>
            </div>
        </nav>
        <div class="container">
        {% if user.is_authenticated %}
        <h1>Welcome,{{ user.username }}.</h1>
        {% else %}
        <h1>Welcome, Visitor.</h1>
        {% endif %}
        <hr>
        {% block content %}
        {% endblock %}
        </div>

        
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    </body>
</html>
